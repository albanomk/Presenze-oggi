<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Presenze">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-512.png">
<title>Presenze</title>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<style>
  :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
  *{box-sizing:border-box}
  body{margin:0;background:#f5f5f7;color:#111;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
  .wrap{max-width:720px;margin:auto;padding:14px}
  .card{background:#fff;border-radius:20px;padding:16px;box-shadow:0 8px 28px rgba(0,0,0,.08)}
  h1{margin:0 0 4px;font-size:28px}
  .sub{margin:0 0 15px;color:#666}
  .pick{display:inline-block;background:#111827;color:#fff;padding:13px 16px;border-radius:13px;font-weight:800;cursor:pointer}
  .excelLink{display:inline-block;margin-left:8px;background:#e8f0fe;color:#174ea6;padding:13px 16px;border-radius:13px;font-weight:800;text-decoration:none}
  .actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #file{display:none}
  #dateBox{display:none;margin:14px 0 4px}
  #dateBox label{display:block;margin-bottom:6px;font-weight:800}
  #dateSelect{width:100%;font:inherit;font-weight:700;background:#fff;color:#111;border:1px solid #cfd1d4;border-radius:12px;padding:12px 40px 12px 12px}
  #install{margin:12px 0;padding:11px 12px;border-radius:12px;background:#eef2ff;color:#3730a3;font-size:14px}
  #info{margin:14px 0;font-weight:800}
  .row{display:grid;grid-template-columns:1fr 110px;border:1px solid #ddd;border-radius:12px;overflow:hidden;margin:8px 0;background:#fff}
  .name{padding:12px;font-weight:700;display:flex;align-items:center}
  .state{padding:12px;display:flex;align-items:center;justify-content:center;font-weight:800;text-align:center;min-height:46px}
  .err{background:#ffe9e9;color:#8b0000;padding:10px;border-radius:10px;margin-top:12px}
  @media(max-width:520px){.wrap{padding:10px}.row{grid-template-columns:1fr 92px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Presenze</h1>
    <p class="sub">Scegli il file Excel e la data da visualizzare.</p>

    <div id="install">Su iPhone: apri in Safari → Condividi → <b>Aggiungi a schermata Home</b>.</div>

    <div class="actions">
      <label class="pick" for="file">Scegli file Excel</label>
      <a class="excelLink" href="https://gruppofsitaliane-my.sharepoint.com/:u:/g/personal/940700_rfi_it/IQAmLc0Ch90oTbnaraOu3oeNAd2ayhBF8myW3ZfWTLnAZtQ?email=m.albano%40rfi.it&e=edVpen" target="_blank" rel="noopener noreferrer">Apri file Excel</a>
    </div>
    <input id="file" type="file" accept=".xlsx">

    <div id="dateBox">
      <label for="dateSelect">Data da visualizzare</label>
      <select id="dateSelect"></select>
    </div>

    <div id="info"></div>
    <div id="out"></div>
    <div id="err" class="err" style="display:none"></div>
  </div>
</div>

<script>
const fileInput=document.getElementById('file');
const dateBox=document.getElementById('dateBox');
const dateSelect=document.getElementById('dateSelect');
const out=document.getElementById('out');
const info=document.getElementById('info');
const err=document.getElementById('err');
const install=document.getElementById('install');

let currentWorkbook=null;
let availableDates=[];

if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone) {
  install.style.display='none';
}

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}

function cssColor(argb,fallback){
  if(!argb)return fallback;
  let s=String(argb).replace('#','');
  if(s.length===8)s=s.slice(2);
  return /^[0-9a-fA-F]{6}$/.test(s)?'#'+s:fallback;
}

function excelDate(value,text){
  if(value instanceof Date)return new Date(value.getFullYear(),value.getMonth(),value.getDate());
  if(typeof value==='number'){
    const ms=Math.round((value-25569)*86400*1000);
    const dt=new Date(ms);
    return new Date(dt.getUTCFullYear(),dt.getUTCMonth(),dt.getUTCDate());
  }
  const s=String(text||value||'').trim();
  const mm=s.match(/^(\d{1,2})[\/\-.](\d{1,2})(?:[\/\-.](\d{2,4}))?$/);
  if(mm){
    let y=mm[3]?Number(mm[3]):new Date().getFullYear();
    if(y<100)y+=2000;
    return new Date(y,Number(mm[2])-1,Number(mm[1]));
  }
  return null;
}

function dateKey(dt){
  return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
}

function formatDate(dt){
  return `${String(dt.getDate()).padStart(2,'0')}/${String(dt.getMonth()+1).padStart(2,'0')}/${dt.getFullYear()}`;
}

function collectDates(wb){
  const found=[];
  wb.eachSheet(ws=>{
    for(let c=3;c<=33;c++){
      const cell=ws.getCell(6,c);
      const dt=excelDate(cell.value,cell.text);
      if(dt){
        found.push({key:dateKey(dt),date:dt,ws,col:c});
      }
    }
  });
  found.sort((a,b)=>a.date-b.date);
  return found;
}

function renderSelection(entry){
  err.style.display='none';
  out.innerHTML='';
  if(!entry)return;

  info.textContent=`${formatDate(entry.date)} · ${entry.ws.name}`;

  for(let r=7;r<=49;r++){
    const name=String(entry.ws.getCell(r,2).text||'').trim();
    if(!name)continue;
    const cell=entry.ws.getCell(r,entry.col);
    const text=String(cell.text ?? '');

    let bg='#ffffff';
    if(cell.fill && cell.fill.type==='pattern' && cell.fill.fgColor) bg=cssColor(cell.fill.fgColor.argb,bg);

    let fg='#111111';
    if(cell.font && cell.font.color) fg=cssColor(cell.font.color.argb,fg);

    const row=document.createElement('div'); row.className='row';
    const n=document.createElement('div'); n.className='name'; n.textContent=name;
    const s=document.createElement('div'); s.className='state'; s.style.background=bg; s.style.color=fg; s.textContent=text;
    row.appendChild(n); row.appendChild(s); out.appendChild(row);
  }
}

dateSelect.addEventListener('change',()=>{
  const idx=Number(dateSelect.value);
  renderSelection(availableDates[idx]);
});

fileInput.addEventListener('change',async()=>{
  err.style.display='none'; out.innerHTML=''; info.textContent='Lettura file...'; dateBox.style.display='none';
  try{
    const f=fileInput.files[0]; if(!f)return;
    const buf=await f.arrayBuffer();
    const wb=new ExcelJS.Workbook();
    await wb.xlsx.load(buf);
    currentWorkbook=wb;
    availableDates=collectDates(wb);

    if(!availableDates.length) throw new Error('Non trovo date valide nella riga 6 del file Excel.');

    dateSelect.innerHTML='';
    availableDates.forEach((entry,i)=>{
      const opt=document.createElement('option');
      opt.value=String(i);
      opt.textContent=formatDate(entry.date);
      dateSelect.appendChild(opt);
    });

    const today=dateKey(new Date());
    let selectedIndex=availableDates.findIndex(x=>x.key===today);
    if(selectedIndex<0) selectedIndex=0;

    dateSelect.value=String(selectedIndex);
    dateBox.style.display='block';
    renderSelection(availableDates[selectedIndex]);
  }catch(e){
    info.textContent=''; err.textContent=e.message||String(e); err.style.display='block';
  }
});
</script>
</body>
</html>
